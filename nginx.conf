server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # Increase client body size limit for file uploads
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy API requests
    # Special handling for auth endpoints that don't have /api prefix in backend
    location ~ ^/api/auth/(login|register|user|cost-config|me|redeem|google|callback) {
        # IMPORTANT: Use break flag to stop processing and use current location
        # The rewrite changes /api/auth/xxx to /auth/xxx
        rewrite ^/api/auth/(.*) /auth/$1 break;
        
        proxy_pass http://8.212.18.47:8910;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Handle CORS for auth
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # location /api/auth/ {
        # This block is redundant if we have a catch-all /api/ block below that does the same thing
        # unless we need specific headers or behavior for auth.
        # Let's comment it out to let /api/ handle everything to avoid confusion.
        
        # Do not rewrite /api/auth/xxx to /auth/xxx
        # rewrite ^/api/auth/(.*) /auth/$1 break;
        
        # When proxy_pass has NO URI part (no trailing slash or path), Nginx passes the full request URI.
        # This means /api/auth/login is passed as /api/auth/login to backend.
        # proxy_pass http://8.212.18.47:8910;
        
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
        
        # Handle CORS for auth
        # if ($request_method = 'OPTIONS') {
        #    add_header 'Access-Control-Allow-Origin' '*';
        #    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
        #    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
        #    add_header 'Access-Control-Max-Age' 1728000;
        #    add_header 'Content-Type' 'text/plain; charset=utf-8';
        #    add_header 'Content-Length' 0;
        #    return 204;
        # }
    # }

    location /resources/ {
        # Proxy static resources to backend
        # Add trailing slash to proxy_pass to strip /resources/ prefix if backend expects it
        # But usually static file serving matches the path structure
        # If backend serves at /resources/..., then keep it as is.
        # If backend serves at /..., then use trailing slash.
        
        # Trying with trailing slash behavior to match typical static file serving
        proxy_pass http://8.212.18.47:8910/resources/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache resources
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    location /api/ {
        # Proxy to backend service running on host machine port 8910
        # Rewrite /api/xxx to /xxx (remove /api prefix)
        # rewrite ^/api/(.*) /$1 break;
        
        proxy_pass http://8.212.18.47:8910;
        
        # Increase proxy timeouts to avoid 504 Gateway Timeout
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Handle CORS
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
}
